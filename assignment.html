<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSG — Assignment</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#ffffff;--black:#111111;
  --c-appearance:#ddadd0;--c-autoperception:#7a1142;--c-desire:#ddadd0;
  --c-inheritance:#009444;--c-fear:#ffcf00;--c-nerve:#e20613;
  --c-mirroring:#4963ab;--c-traces:#7a1142;
  --sans:'Inter',sans-serif;--serif:'Lora',Georgia,serif;
}
html,body{height:100%;background:var(--white);color:var(--black);font-family:var(--sans);overflow-x:hidden}
body{min-height:100vh;display:flex;flex-direction:column}
body>div{flex:1;display:flex;flex-direction:column}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:18px 40px;background:var(--white);border-bottom:1px solid rgba(0,0,0,0.1)}
.nav-logo{font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:0.06em;color:var(--black);text-decoration:none;cursor:pointer}
.nav-links{display:flex;gap:36px;list-style:none}
.nav-links a{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--black);text-decoration:none;transition:color .2s;letter-spacing:0.01em;cursor:pointer}
.nav-links a.active{color:rgba(0,0,0,0.32)}
.nav-links a:not(.active):hover{color:var(--black);opacity:.7}

/* ASSIGNMENT PAGE */
#assignment-page{padding-top:80px;min-height:100vh;display:flex;flex-direction:column}

/* Top color bar */
.assignment-color-bar{height:6px;width:100%;transition:background .3s}

/* Header section */
.assignment-header{padding:48px 56px 32px;border-bottom:1px solid rgba(0,0,0,0.1)}
.assignment-back{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:rgba(0,0,0,0.35);margin-bottom:16px;cursor:pointer;display:inline-block;transition:color .2s}
.assignment-back:hover{color:var(--black)}
.assignment-topic-label{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:rgba(0,0,0,0.35);margin-bottom:8px}
.assignment-title{font-family:var(--serif);font-size:clamp(36px,4vw,56px);font-weight:400;line-height:1.1;letter-spacing:-0.02em;margin-bottom:16px}
.assignment-description{font-family:var(--serif);font-size:clamp(16px,1.5vw,20px);line-height:1.6;opacity:.7;max-width:700px;font-style:italic}

/* Content area */
.assignment-content{flex:1;padding:48px 56px;display:flex;flex-direction:column;gap:32px;max-width:900px;margin:0 auto;width:100%}

/* Input section */
.input-section{border:1px solid rgba(0,0,0,0.1);border-radius:4px;overflow:hidden}
.input-section-header{padding:20px 28px;background:rgba(0,0,0,0.03);border-bottom:1px solid rgba(0,0,0,0.08)}
.input-section-title{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(0,0,0,0.45)}

/* Text input */
.text-input-area{width:100%;min-height:200px;padding:28px;border:none;outline:none;font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--black);background:var(--white);resize:vertical}
.text-input-area::placeholder{color:rgba(0,0,0,0.25);font-style:italic}

/* Image upload */
.image-upload-area{padding:28px;border-top:1px solid rgba(0,0,0,0.08)}
.upload-label{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border:1px solid rgba(0,0,0,0.2);border-radius:3px;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--black);transition:all .2s;background:var(--white)}
.upload-label:hover{background:rgba(0,0,0,0.04);border-color:var(--black)}
.upload-icon{width:16px;height:16px;border:1.5px solid var(--black);border-radius:2px;display:flex;align-items:center;justify-content:center}
.upload-icon::before,.upload-icon::after{content:'';position:absolute}
.upload-icon::before{width:8px;height:1.5px;background:var(--black)}
.upload-icon::after{width:1.5px;height:8px;background:var(--black)}
.upload-label{position:relative}
.upload-input{display:none}

/* Image preview */
.image-preview-container{margin-top:20px;position:relative;display:none}
.image-preview-container.has-image{display:block}
.image-preview{max-width:100%;max-height:400px;border-radius:3px;border:1px solid rgba(0,0,0,0.1)}
.image-remove{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;background:var(--black);color:var(--white);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.image-remove:hover{opacity:.7}

/* Save button */
.save-section{display:flex;align-items:center;gap:20px;padding:20px 0;flex-wrap:wrap}
.save-btn{padding:14px 32px;background:var(--black);color:var(--white);border:none;border-radius:3px;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;transition:all .2s}
.save-btn:hover{opacity:.85;transform:translateY(-1px)}
.save-btn:active{transform:translateY(0)}
.save-status{font-family:var(--sans);font-size:12px;color:rgba(0,0,0,0.4);transition:color .2s}
.save-status.saved{color:rgba(0,0,0,0.7)}

/* Existing submission display */
.existing-submission{border:1px solid rgba(0,0,0,0.1);border-radius:4px;padding:28px;background:rgba(0,0,0,0.02);display:none}
.existing-submission.has-content{display:block}
.existing-submission-header{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:rgba(0,0,0,0.35);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.existing-submission-header .edit-toggle{cursor:pointer;color:rgba(0,0,0,0.5);transition:color .2s}
.existing-submission-header .edit-toggle:hover{color:var(--black)}
.existing-text{font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--black);white-space:pre-wrap}
.existing-image{max-width:100%;max-height:400px;border-radius:3px;margin-top:16px}

/* Color band */
.color-band{display:flex;height:8px;width:100%}
.color-band span{flex:1}

/* Footer */
#footer-container{margin-top:auto}
footer{padding:40px 56px;border-top:1px solid rgba(0,0,0,0.1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.footer-logo{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:0.06em;color:var(--black)}
.footer-copy{font-family:var(--sans);font-size:12px;color:rgba(0,0,0,0.32)}
.footer-contact{font-family:var(--serif);font-style:italic;font-size:13px;color:rgba(0,0,0,0.38);display:flex;align-items:center;gap:8px}
.footer-contact a{color:rgba(0,0,0,0.38);text-decoration:none;border-bottom:1px solid rgba(0,0,0,0.15);padding-bottom:1px;transition:color .2s,border-color .2s}
.footer-contact a:hover{color:var(--black);border-color:var(--black)}

/* ── Hamburger ── */
.nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;background:none;border:none;cursor:pointer;padding:2px}
.nav-toggle span{display:block;width:22px;height:2px;background:var(--black);transition:transform .25s,opacity .25s}

/* ── Responsive ── */
@media(max-width:768px){
  nav{padding:14px 20px}
  .nav-toggle{display:flex}
  .nav-links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--white);padding:8px 20px 20px;border-bottom:1px solid rgba(0,0,0,0.12);gap:0;z-index:199}
  .nav-links.open{display:flex}
  .nav-links li{padding:14px 0;border-bottom:1px solid rgba(0,0,0,0.06)}
  .nav-links li:last-child{border-bottom:none}
  .nav-links a{font-size:15px}
  .assignment-header{padding:32px 20px 24px}
  .assignment-content{padding:24px 20px}
  footer{padding:24px 20px}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">TSG</a>
  <ul class="nav-links">
    <li><a href="assignments.html" class="active">Assignments</a></li>
    <li><a href="community.html">Community</a></li>
    <li><a href="shop.html">Shop</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="terms.html">Terms</a></li>
  </ul>
  <button class="nav-toggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
</nav>

<!-- ════════ ASSIGNMENT PAGE ════════ -->
<div id="assignment-page">
  <div class="assignment-color-bar" id="color-bar"></div>

  <div class="assignment-header">
    <a href="assignments.html" class="assignment-back">&#8592; Back to Assignments</a>
    <p class="assignment-topic-label" id="topic-label"></p>
    <h1 class="assignment-title" id="assignment-title"></h1>
    <p class="assignment-description" id="assignment-description"></p>
  </div>

  <div class="assignment-content">
    <!-- Existing submission display -->
    <div class="existing-submission" id="existing-submission">
      <div class="existing-submission-header">
        <span>Your Submission</span>
        <span class="edit-toggle" id="edit-toggle">(Edit)</span>
      </div>
      <div id="submission-content"></div>
    </div>

    <!-- Input section -->
    <div class="input-section" id="input-section">
      <div class="input-section-header">
        <span class="input-section-title">Your Response</span>
      </div>

      <!-- Text input -->
      <textarea class="text-input-area" id="text-input" placeholder="Write your response here..."></textarea>

      <!-- Image upload -->
      <div class="image-upload-area">
        <label class="upload-label">
          <input type="file" class="upload-input" id="image-input" accept="image/*">
          <span class="upload-icon"></span>
          Upload Image
        </label>
        <div class="image-preview-container" id="image-preview-container">
          <img class="image-preview" id="image-preview" src="" alt="Preview">
          <button class="image-remove" id="image-remove" title="Remove image">&times;</button>
        </div>
      </div>
    </div>

    <!-- Save section -->
    <div class="save-section">
      <button class="save-btn" id="save-btn">Save Assignment</button>
      <span class="save-status" id="save-status"></span>
    </div>
  </div>

  <div class="color-band">
    <span style="background:var(--c-appearance)"></span>
    <span style="background:var(--c-autoperception)"></span>
    <span style="background:var(--c-desire)"></span>
    <span style="background:var(--c-inheritance)"></span>
    <span style="background:var(--c-fear)"></span>
    <span style="background:var(--c-nerve)"></span>
    <span style="background:var(--c-mirroring)"></span>
    <span style="background:var(--c-traces)"></span>
  </div>

  <footer>
    <span class="footer-logo">TSG</span>
    <span class="footer-contact">Press & collaborations —
      <a href="mailto:hello@thesubordinategaze.com">hello@thesubordinategaze.com</a>
    </span>
    <span class="footer-copy">The Subordinate Gaze &copy; 2025</span>
  </footer>
</div>

<script>
// Assignment data - inline for standalone HTML file
const ASSIGNMENTS_DATA = {
  appearance: {
    topicKey: 'appearance',
    topicLabel: 'Appearance',
    color: '#ddadd0',
    assignments: [
      { id: 'appearance-01', title: `The gaze you return`, description: `Being looked at is not the same as being seen — and looking back is its own quiet rebellion. Trace what happens in your body the moment you stop absorbing a gaze and start meeting it.`, submissions: { text: '', image: null } },
      { id: 'appearance-02', title: `The Performer`, description: `Everyone has a version of themselves built for an audience — the one who walks taller, laughs louder, edits in real time. Sketch that character, costume and all, and ask who they're performing for.`, submissions: { text: '', image: null } },
      { id: 'appearance-03', title: `What's wrong with the people in my class?`, description: `A tongue-in-cheek autopsy of the small, harmless ways we judge a room of strangers within seconds. Write the verdicts you'd never say out loud, then turn the mirror around.`, submissions: { text: '', image: null } },
      { id: 'appearance-04', title: `Photograph a scar`, description: `A scar is proof the body survived something and kept going anyway. Photograph one — yours or someone else's, with permission — and let it be evidence, not apology.`, submissions: { text: '', image: null } },
      { id: 'appearance-05', title: `The room before you enter it`, description: `There's a version of every room that exists in the seconds before you walk in — expectation, posture, the small performance of arrival. Describe that threshold moment, before the room gets to react to you.`, submissions: { text: '', image: null } },
      { id: 'appearance-06', title: `How to behave in a crowd`, description: `We all carry an unwritten etiquette for disappearing safely into a group. Write the instructions you've absorbed without ever being taught them directly.`, submissions: { text: '', image: null } },
      { id: 'appearance-07', title: `Dress code`, description: `Every space has an unspoken dress code, written or not, and a cost for breaking it. Write the rules you've learned to read on sight, and where you've chosen to ignore them.`, submissions: { text: '', image: null } }
    ]
  },
  autoperception: {
    topicKey: 'autoperception',
    topicLabel: 'Autoperception',
    color: '#7a1142',
    assignments: [
      { id: 'autoperception-01', title: `Pieces of you`, description: `You are not one self but a collage of selves, stitched together from every room you've ever stood in. This is an invitation to stop looking for the 'real' you and start collecting the fragments — the contradictions, the masks, the leftover pieces — and let them sit beside each other without apology.`, submissions: { text: '', image: null } },
      { id: 'autoperception-02', title: `Ask your family who you are`, description: `Family holds an origin story about you that you've never fully read. Ask, collect the answers without correcting them, and place your own version next to theirs.`, submissions: { text: '', image: null } },
      { id: 'autoperception-03', title: `Revisit your 14 self`, description: `She had opinions about who you'd become, and she was both right and completely wrong. Write her a letter, or better, let her write one to you.`, submissions: { text: '', image: null } },
      { id: 'autoperception-04', title: `The version of you nobody has met yet`, description: `She's been waiting in the wings this whole time, half-formed and unannounced. Describe her without rushing her into existence.`, submissions: { text: '', image: null } },
      { id: 'autoperception-05', title: `The self you refuse to see`, description: `There's a version of you that doesn't make it into the self-portrait, the one you edit out before anyone looks. Let her in, just this once, without flinching.`, submissions: { text: '', image: null } },
      { id: 'autoperception-06', title: `Interview someone about becoming`, description: `Ask someone older, or simply someone further along, how they became who they are. Let their answer complicate everything you assumed about arriving.`, submissions: { text: '', image: null } },
      { id: 'autoperception-07', title: `The body I inherited`, description: `Long before it was yours to decide, your body arrived carrying someone else's hands, someone else's posture, someone else's history. Trace the parts of it that aren't fully your own invention.`, submissions: { text: '', image: null } },
      { id: 'autoperception-08', title: `Names I have worn`, description: `Nicknames, titles, the names given in anger or in love — each one is a costume that fit for a while. List the names you've answered to, and what each one asked of you.`, submissions: { text: '', image: null } },
      { id: 'autoperception-09', title: `The work of being yourself`, description: `Authenticity is sold as effortless, but it's labour, like everything else worth having. Document what it actually takes, on an ordinary day, to be recognisably you.`, submissions: { text: '', image: null } },
      { id: 'autoperception-10', title: `Five events that made you who you are`, description: `Not the whole story — just the five hinge points where something turned. List them plainly, no need to explain or justify.`, submissions: { text: '', image: null } }
    ]
  },
  desire: {
    topicKey: 'desire',
    topicLabel: 'Desire',
    color: '#ddadd0',
    assignments: [
      { id: 'desire-01', title: `The best of both worlds`, description: `Wanting two things at once isn't indecision, it's honesty. Map out the tug-of-war between the lives you could lead, and notice how rarely you're asked to want just one thing.`, submissions: { text: '', image: null } },
      { id: 'desire-02', title: `Heartbreak survival guide`, description: `Write the manual nobody handed you: the rituals, the playlists, the small acts of defiance that get a person through. Make it practical, make it tender, make it yours.`, submissions: { text: '', image: null } },
      { id: 'desire-03', title: `Take a picture of strangers holding hands`, description: `Tenderness happens in public more than we notice, if we're paying attention. Go find proof of it and bring it back.`, submissions: { text: '', image: null } },
      { id: 'desire-04', title: `Ways to say "I Love You" without saying it`, description: `Love rarely announces itself in those exact three words; it shows up sideways, in gestures and habits and the way someone remembers how you take your coffee. Catalogue the quieter dialects of affection you actually speak.`, submissions: { text: '', image: null } },
      { id: 'desire-05', title: `The shape of wanting`, description: `Desire rarely sits still long enough to be named cleanly. Give it a shape instead — a drawing, a diagram, a silhouette of what wanting actually feels like in you.`, submissions: { text: '', image: null } },
      { id: 'desire-06', title: `Intimacy without touch`, description: `Closeness doesn't always need a hand to hold it together. Map the moments of intimacy that happened entirely without contact — eye contact, silence, the right word at the right time.`, submissions: { text: '', image: null } },
      { id: 'desire-07', title: `The unsent conversation`, description: `Somewhere there's a message still sitting in drafts, a conversation that exists only in your head. Write it out in full, and decide, just for yourself, whether it needed an audience at all.`, submissions: { text: '', image: null } }
    ]
  },
  inheritance: {
    topicKey: 'inheritance',
    topicLabel: 'Inheritance',
    color: '#009444',
    assignments: [
      { id: 'inheritance-01', title: `The rules you inherited`, description: `Long before you could question them, the rules were already moving in — about how to sit, want, speak, take up space. List the ones still running quietly in the background, and circle the ones you're ready to evict.`, submissions: { text: '', image: null } },
      { id: 'inheritance-02', title: `The silence that was passed down`, description: `Some inheritances are absences — the things nobody said, the topics that closed a room. Give shape to the silence that's been handed down through your family, and decide whether you're going to keep it.`, submissions: { text: '', image: null } },
      { id: 'inheritance-03', title: `The last memory`, description: `Some memories arrive knowing they're the last of their kind, even before you do. Write the one that's still holding its shape, and what it left behind.`, submissions: { text: '', image: null } },
      { id: 'inheritance-04', title: `What would your mother/father figure say?`, description: `Their voice has a way of showing up in your head long after the conversation ended. Write what they'd say about where you are right now, and what you'd say back.`, submissions: { text: '', image: null } }
    ]
  },
  fear: {
    topicKey: 'fear',
    topicLabel: 'Fear',
    color: '#ffcf00',
    assignments: [
      { id: 'fear-01', title: `Accessing a future without limitations`, description: `Fear is a brilliant editor; it cuts whole futures before you even get to read the draft. Write or draw the version of your life with that editor fired, just for one page.`, submissions: { text: '', image: null } },
      { id: 'fear-02', title: `Guide to escaping creative paralysis`, description: `The blank page is rarely about a lack of ideas; it's about the fear standing guard in front of them. Build yourself an exit route, step by step, for the next time you freeze.`, submissions: { text: '', image: null } },
      { id: 'fear-03', title: `What you would risk`, description: `There's a version of bravery that has nothing to do with being fearless and everything to do with deciding something is worth the fall. Name what you'd actually be willing to lose, and for what.`, submissions: { text: '', image: null } },
      { id: 'fear-04', title: `Defeat your inner imposter`, description: `That voice insisting you don't belong here has never once been right about anything. Write the rebuttal it's never gotten.`, submissions: { text: '', image: null } },
      { id: 'fear-05', title: `The conversation you keep postponing`, description: `You know the one. Write the version you'd say if you weren't waiting for the perfect moment that never actually comes.`, submissions: { text: '', image: null } },
      { id: 'fear-06', title: `What you would burn down if you weren't so reasonable`, description: `Reasonableness is its own quiet cage sometimes. Name what you'd let go up in flames if you stopped negotiating with yourself for one minute.`, submissions: { text: '', image: null } },
      { id: 'fear-07', title: `Advise your former self`, description: `She couldn't have known then what you know now, and that's exactly the point. Write her the advice she wasn't ready to hear yet.`, submissions: { text: '', image: null } }
    ]
  },
  nerve: {
    topicKey: 'nerve',
    topicLabel: 'Nerve',
    color: '#e20613',
    assignments: [
      { id: 'nerve-01', title: `Submission as strategy`, description: `Sometimes bending is the smartest move in the room. Explore the difference between submitting because you have no choice and submitting because you're playing a longer game — and where that line gets blurry.`, submissions: { text: '', image: null } },
      { id: 'nerve-02', title: `Make a protest sign about something ridiculous`, description: `Protest doesn't have to be solemn to be sincere. Pick the smallest, silliest injustice you've ever felt and give it the full weight of a placard.`, submissions: { text: '', image: null } },
      { id: 'nerve-03', title: `What we carry together`, description: `Some weight was never meant to be carried alone, even when we've been taught to act like it should be. Name what you're holding on behalf of someone else, and what it would mean to set part of it down, together.`, submissions: { text: '', image: null } },
      { id: 'nerve-04', title: `Describe your ideal government`, description: `Forget what's realistic for a moment and design the world as it should run, not as it does. Who holds power, who doesn't, and why does it finally feel fair?`, submissions: { text: '', image: null } },
      { id: 'nerve-05', title: `Draw the news`, description: `Skip the headline and draw the feeling underneath it instead. Let today's news become an image instead of another scroll.`, submissions: { text: '', image: null } },
      { id: 'nerve-06', title: `We interrupt this programme`, description: `Imagine you could break into the broadcast, just for thirty seconds, and say the thing nobody's saying. Write the interruption.`, submissions: { text: '', image: null } },
      { id: 'nerve-07', title: `The authority you claim`, description: `Nobody crowns you an expert on your own life; you have to take that authority for yourself. Write the territory only you get to have the final say over.`, submissions: { text: '', image: null } },
      { id: 'nerve-08', title: `The story you add to the wall`, description: `Every wall of stories needs one more confession, one more thing finally said out loud. Add yours, anonymous or not.`, submissions: { text: '', image: null } },
      { id: 'nerve-09', title: `Write a manifesto for something nobody defends`, description: `Pick the unfashionable, the unglamorous, the thing everyone quietly mocks, and defend it with total conviction. Manifestos work best when nobody asked for them.`, submissions: { text: '', image: null } },
      { id: 'nerve-10', title: `What would you say if they were actually listening?`, description: `Most of us have rehearsed a version of honesty we never quite deliver. Say it here first, exactly as it would sound if you knew it would land.`, submissions: { text: '', image: null } }
    ]
  },
  mirroring: {
    topicKey: 'mirroring',
    topicLabel: 'Mirroring',
    color: '#4963ab',
    assignments: [
      { id: 'mirroring-01', title: `This song made me think of…`, description: `Some songs don't just soundtrack a moment, they hand you a mirror you didn't ask for. Follow one back to whoever — or whatever — it keeps reflecting.`, submissions: { text: '', image: null } },
      { id: 'mirroring-02', title: `What do you know?`, description: `Not facts — instinct. Write down what you know in your body, the things you've never had to verify because they simply are.`, submissions: { text: '', image: null } },

      { id: 'traces-02', title: `Everything in your bag right now`, description: `Empty it out. A bag is an unintentional self-portrait — the receipts, the half-used everything, the one item that doesn't belong but you can't throw away.`, submissions: { text: '', image: null } },

// DOM elements
const colorBar = document.getElementById('color-bar');
const topicLabel = document.getElementById('topic-label');
const assignmentTitle = document.getElementById('assignment-title');
const assignmentDescription = document.getElementById('assignment-description');
const textInput = document.getElementById('text-input');
const imageInput = document.getElementById('image-input');
const imagePreviewContainer = document.getElementById('image-preview-container');
const imagePreview = document.getElementById('image-preview');
const imageRemove = document.getElementById('image-remove');
const saveBtn = document.getElementById('save-btn');
const saveStatus = document.getElementById('save-status');
const existingSubmission = document.getElementById('existing-submission');
const submissionContent = document.getElementById('submission-content');
const editToggle = document.getElementById('edit-toggle');
const inputSection = document.getElementById('input-section');

let currentAssignment = null;
let currentTopic = null;
let pendingImage = null;
let isEditMode = false;

// Load saved submissions from localStorage
function loadSavedSubmissions() {
  try {
    const saved = localStorage.getItem('assignmentSubmissions');
    if (saved) {
      return JSON.parse(saved);
    }
  } catch (e) {
    console.warn('Failed to load saved submissions:', e);
  }
  return {};
}

// Save submissions to localStorage
function saveSubmissions(submissions) {
  try {
    localStorage.setItem('assignmentSubmissions', JSON.stringify(submissions));
    return true;
  } catch (e) {
    console.warn('Failed to save submissions:', e);
    return false;
  }
}

// Convert file to base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Parse URL params
function getUrlParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    topic: params.get('topic'),
    index: parseInt(params.get('index')) || 0
  };
}

// Render existing submission
function renderExistingSubmission(assignment) {
  const hasText = assignment.submissions && assignment.submissions.text;
  const hasImage = assignment.submissions && assignment.submissions.image;

  if (!hasText && !hasImage) {
    existingSubmission.classList.remove('has-content');
    return;
  }

  existingSubmission.classList.add('has-content');
  let html = '';

  if (hasText) {
    html += `<div class="existing-text">${hasText.replace(/</g, '<').replace(/>/g, '>')}</div>`;
  }
  if (hasImage) {
    html += `<img class="existing-image" src="${hasImage}" alt="Assignment submission">`;
  }

  submissionContent.innerHTML = html;
}

// Show input section when editing
function showInput() {
  isEditMode = true;
  existingSubmission.style.display = 'none';
  inputSection.style.display = 'block';
  editToggle.textContent = '(Cancel)';
  textInput.focus();
}

// Hide input section to show submission
function hideInput() {
  isEditMode = false;
  existingSubmission.style.display = 'block';
  editToggle.textContent = '(Edit)';
}

// Initialize page
function init() {
  const { topic: topicKey, index } = getUrlParams();

  // Find topic
  currentTopic = ASSIGNMENTS_DATA[topicKey];
  if (!currentTopic) {
    // Default to appearance if invalid topic
    currentTopic = ASSIGNMENTS_DATA.appearance;
  }

  // Get assignment
  currentAssignment = currentTopic.assignments[index];
  if (!currentAssignment) {
    currentAssignment = currentTopic.assignments[0];
  }

  // Set colors
  colorBar.style.background = currentTopic.color;

  // Set content
  const assignmentNum = currentTopic.assignments.indexOf(currentAssignment) + 1;
  topicLabel.textContent = currentTopic.topicLabel + ' — Assignment #' + assignmentNum;
  assignmentTitle.textContent = currentAssignment.title;
  assignmentDescription.textContent = currentAssignment.description;

  // Load saved submissions
  const allSubmissions = loadSavedSubmissions();
  const savedSubmission = allSubmissions[currentAssignment.id];

  if (savedSubmission) {
    // Populate form with saved data
    textInput.value = savedSubmission.text || '';
    if (savedSubmission.image) {
      pendingImage = savedSubmission.image;
      imagePreview.src = savedSubmission.image;
      imagePreviewContainer.classList.add('has-image');
    }
    renderExistingSubmission(savedSubmission);
  } else {
    // Clear form
    textInput.value = '';
    pendingImage = null;
    imagePreview.src = '';
    imagePreviewContainer.classList.remove('has-image');
    existingSubmission.classList.remove('has-content');
  }

  hideInput();
}

// Event listeners

// Image file selection
imageInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  try {
    const base64 = await fileToBase64(file);
    pendingImage = base64;
    imagePreview.src = base64;
    imagePreviewContainer.classList.add('has-image');
    // Clear saved state since we have new pending data
    saveStatus.textContent = '';
    saveStatus.classList.remove('saved');
  } catch (err) {
    console.warn('Failed to read image:', err);
  }
});

// Remove image
imageRemove.addEventListener('click', () => {
  pendingImage = null;
  imagePreview.src = '';
  imagePreviewContainer.classList.remove('has-image');
  imageInput.value = '';
  saveStatus.textContent = '';
  saveStatus.classList.remove('saved');
});

// Save button
saveBtn.addEventListener('click', () => {
  if (!currentAssignment) return;

  const allSubmissions = loadSavedSubmissions();

  // Update assignment data
  allSubmissions[currentAssignment.id] = {
    text: textInput.value.trim(),
    image: pendingImage
  };

  const success = saveSubmissions(allSubmissions);

  if (success) {
    saveStatus.textContent = 'Saved';
    saveStatus.classList.add('saved');

    // Update existing submission display
    const updatedSubmission = allSubmissions[currentAssignment.id];
    renderExistingSubmission(updatedSubmission);
    hideInput();

    // Clear status after 3 seconds
    setTimeout(() => {
      saveStatus.textContent = '';
      saveStatus.classList.remove('saved');
    }, 3000);
  } else {
    saveStatus.textContent = 'Save failed — storage may be full';
    saveStatus.classList.remove('saved');
  }
});

// Edit toggle
editToggle.addEventListener('click', () => {
  if (isEditMode) {
    hideInput();
  } else {
    showInput();
  }
});

// Nav toggle
document.querySelector('.nav-toggle').addEventListener('click', function() {
  document.querySelector('.nav-links').classList.toggle('open');
});

// Text input changes clear saved status
textInput.addEventListener('input', () => {
  saveStatus.textContent = '';
  saveStatus.classList.remove('saved');
});

// Initialize on load
init();
</script>
</body>
</html>
